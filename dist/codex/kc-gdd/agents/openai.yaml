interface:
  display_name: "Git Diff Review"
  short_description: "Summarize and review each changed file in Chinese [逐文件说明并审查当前改动]"
  default_prompt: "立即检查当前仓库状态，忽略上一段对话话题，找出所有当前改动文件；默认必须用中文输出。逐文件说明主要改动，然后给出可优化点、最小化实现判断、影响范围或风险审查。只有用户明确要求英文时才允许输出英文。如果没有改动文件，直接用中文说明。"
policy:
  allow_implicit_invocation: false
