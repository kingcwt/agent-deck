interface:
  display_name: "Git Diff Description Push"
  short_description: "Describe, validate, commit, and push [先检查再提交推送]"
  default_prompt: "Immediately inspect the current repository state for this turn, ignore stale conclusions, summarize every current changed file, run repository-defined file-scoped lint and targeted tests only for the final changed files, and create and push one commit only if every applicable changed-file check passes."
policy:
  allow_implicit_invocation: false
